[package]
name = "pojoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime support for Pojoc-generated encode/decode code: a compact binary wire format with first-class schema evolution"
readme = "../../README.md"
keywords = ["serialization", "encoding", "binary", "schema", "codegen"]
categories = ["encoding"]

[lib]
path = "src/lib.rs"

[dependencies]
smallvec = { workspace = true, features = ["const_new"] }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
bytemuck = { workspace = true }
simdutf8 = { version = "0.1.5", features = ["aarch64_neon"] }
ahash = { version = "0.8.14", default-features = false, features = ["runtime-rng", "std"] }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes", "smallvec/serde"]
sidecar-json = ["serde", "dep:serde_json"]
# Use the standard library's hash builder for maps and string interning.
secure-hasher = []
