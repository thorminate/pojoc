[package]
name = "pojoc-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile .pojoc schemas into Rust and TypeScript codecs"
readme = "../../README.md"
keywords = ["serialization", "encoding", "binary", "schema", "codegen"]
categories = ["encoding", "compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
pojoc-compiler.workspace = true
pojoc-build-macros = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["macros", "serde"]
macros = ["dep:pojoc-build-macros"]
# Emit `Serialize`/`Deserialize` derives/impls in generated code. Requires the
# consuming crate to depend on `serde` directly (with the `derive` feature),
# and the `pojoc` runtime crate's own `serde` feature to also be enabled.
serde = ["pojoc-compiler/serde"]
