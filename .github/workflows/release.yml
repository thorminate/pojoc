name: Verify npm trusted publishing

on:
  push:
    branches:
      - codex/verify-npm-oidc

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm token exchange
        run: |
          node --input-type=module <<'JS'
          const packages = [
            "pojoc",
            "@pojoc/cli",
            "@pojoc/cli-darwin-arm64",
            "@pojoc/cli-darwin-x64",
            "@pojoc/cli-linux-x64",
            "@pojoc/cli-win32-x64",
          ];
          const githubUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          githubUrl.searchParams.set("audience", "npm:registry.npmjs.org");

          for (const name of packages) {
            const identity = await fetch(githubUrl, {
              headers: {
                Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
              },
              redirect: "error",
              signal: AbortSignal.timeout(15000),
            });
            if (!identity.ok) throw new Error("GitHub OIDC request returned HTTP " + identity.status);
            const { value } = await identity.json();
            if (!value) throw new Error("GitHub did not issue an OIDC identity token");

            const packageName = encodeURIComponent(name);
            const response = await fetch(
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/" + packageName,
              {
                method: "POST",
                headers: { Authorization: "Bearer " + value },
                redirect: "error",
                signal: AbortSignal.timeout(15000),
              },
            );
            const result = await response.json().catch(() => null);
            if (response.ok && result?.token_type === "oidc" && typeof result.token === "string" && result.token) {
              console.log(name + " — npm accepted the workflow identity");
            } else {
              console.error(name + " — npm token exchange returned HTTP " + response.status);
              const error = [result?.error, result?.message].filter((part) => typeof part === "string").join(" ");
              if (/(?:no matching|no) trusted publisher|trusted publisher.*not found/i.test(error)) {
                console.error(name + " — npm reported a missing matching trusted publisher");
              } else if (/expired/i.test(error)) {
                console.error(name + " — npm reported an expired identity or configuration");
              } else if (/package.*not found/i.test(error)) {
                console.error(name + " — npm reported that the package was not found for token exchange");
              }
              process.exitCode = 1;
            }
          }
          JS
